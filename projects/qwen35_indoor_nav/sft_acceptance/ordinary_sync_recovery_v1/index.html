<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>普通导航基座 · 修复续训监控</title>
<style>body{font:16px system-ui;margin:30px auto;max-width:1080px;padding:0 20px;background:#f3f5f9;color:#152d43}h1{font-size:26px}.panel{background:white;border-radius:12px;padding:20px;margin:15px 0}#state{font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}canvas{width:100%;height:220px}.note{color:#596a78}strong{color:#137d6b}</style>
<h1>普通导航基座 · 同步修复续训</h1><p class="note">只读 · 每 5 秒刷新。下方准确率和 STOP 召回属于训练窗口，不是导航成功率。</p>
<div class="panel"><p id="state">正在连接…</p><div id="summary"></div></div>
<div class="panel"><h3>动作加权交叉熵（横轴：更新步）</h3><canvas id="loss" width="980" height="220"></canvas></div>
<div class="panel"><h3>训练窗口准确率与 STOP 召回（蓝 / 橙）</h3><canvas id="quality" width="980" height="220"></canvas></div>
<div class="panel"><h3>当前运行与检查点</h3><pre id="details"></pre></div>
<script>
function plot(id,pts,keys,colors,bounds){const c=document.getElementById(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(pts.length<2)return;let vals=pts.flatMap(p=>keys.map(k=>p[k])).filter(v=>v!==null&&Number.isFinite(v));if(!vals.length)return;let lo=bounds?bounds[0]:Math.min(...vals),hi=bounds?bounds[1]:Math.max(...vals);if(hi===lo)hi=lo+1;const xmin=pts[0].updates,xmax=Math.max(xmin+1,pts.at(-1).updates);x.font='13px system-ui';x.fillStyle='#596a78';x.fillText(hi.toFixed(2),5,18);x.fillText(lo.toFixed(2),5,192);x.fillText(xmin,45,217);x.fillText(xmax,900,217);keys.forEach((k,j)=>{x.strokeStyle=colors[j];x.lineWidth=2;x.beginPath();let active=false;pts.forEach(p=>{if(p[k]===null||!Number.isFinite(p[k])){active=false;return}const a=45+(p.updates-xmin)/(xmax-xmin)*900,b=190-(p[k]-lo)/(hi-lo)*175;if(active)x.lineTo(a,b);else x.moveTo(a,b);active=true});x.stroke()})}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json(),p=d.progress,c=p.cursor||{},m=p.metrics||{};document.getElementById('state').textContent=d.state+' · 日志年龄 '+(d.progress_age_seconds===null?'—':d.progress_age_seconds.toFixed(1)+' 秒');document.getElementById('summary').textContent='更新 '+(c.updates??'—')+' / 60000 · epoch '+(c.epoch===undefined?'—':c.epoch+1)+' / 3 · 吞吐 '+(p.throughput?.toFixed(1)??'—')+' 决策/秒 · CE '+(m.mean_ce?.toFixed(4)??'—');document.getElementById('details').textContent=JSON.stringify({run:d.supervisor.run_dir,checkpoint:p.latest_checkpoint,charged_compute:p.cumulative_compute,global_plan_decisions:p.global_plan_decisions,deadline:p.wall_deadline_unix?new Date(p.wall_deadline_unix*1000).toLocaleString():null,metrics:m,result:d.result},null,2);plot('loss',d.points,['ce'],['#137d6b']);plot('quality',d.points,['accuracy','stop'],['#2975b9','#df831c'],[0,1])}catch(e){document.getElementById('state').textContent='监控连接失败：'+e.message}}
refresh();setInterval(refresh,5000);
</script></html>
