<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Q35N 事件识别修复</title><style>body{background:#101723;color:#dde7f1;font:16px system-ui;margin:28px;max-width:1100px}table{border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #344152}a{color:#79c7ff}pre{white-space:pre-wrap;max-height:300px;overflow:auto}small{color:#a7b8cb}.card{padding:18px;background:#1b2838;margin:16px 0;border-radius:8px}</style><h1>Q35N · 事件识别修复</h1><p>同一 MONOTONIC：ORIGINAL 原损失 vs EVENT 输入去重、屋与事件角色等权；完整动作教师不变。</p><small>原 DEV 1 屋，主任务 192/臂；控制任务 192/臂。不是独立盲测或普通 VLN-CE。每 5 秒刷新。</small><div id="state" class="card">读取中</div><div id="probe" class="card"></div><table id="probes"></table><table id="training"></table><h2>仅完整配对组</h2><table id="metrics"></table><p><a href="/report">报告与范围</a></p><pre id="log"></pre><script>
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const x=await r.json();document.querySelector('#state').textContent=`${x.status.status} · ${x.status.stage||''} · GPU 会话 ${x.gpu_hours.toFixed(3)} 小时 · 封存 ${x.complete}/${x.planned} · ${new Date().toLocaleTimeString()}`;document.querySelector('#probe').textContent=`FIT 留一屋事件读出 ${x.probe_updates}/3200 步；完整策略 ${x.new_training_updates}/7200 步。${x.event_preflight ? '事件筛选：'+(x.event_preflight.advance_full_policy?'通过工程筛选，进入策略对照':'未达到固定筛选，停止此修复') : '事件读出筛选中，尚无闭环收益结论'}`;
document.querySelector('#probes').innerHTML='<tr><th>读出对照</th><th>留出房屋</th><th>更新</th></tr>'+x.probe.map(y=>`<tr><td>${esc(y.model)}</td><td>${esc(y.held_house)}</td><td>${y.step}/${y.target}</td></tr>`).join('');
document.querySelector('#training').innerHTML='<tr><th>模型</th><th>更新</th><th>终态</th></tr>'+x.training.map(y=>`<tr><td>${esc(y.model)}</td><td>${y.step}/${y.target}</td><td>${y.complete?'完成':'等待/运行'}</td></tr>`).join('');
document.querySelector('#metrics').innerHTML='<tr><th>终点</th><th>方法</th><th>已封存/计划</th><th>PASS</th><th>FAIL</th><th>UNKNOWN</th></tr>'+x.metrics.map(y=>`<tr><td>${esc(y.endpoint)}</td><td>${esc(y.arm)}</td><td>${y.complete}/${y.planned}</td><td>${y.passed}</td><td>${y.failed}</td><td>${y.unknown}</td></tr>`).join('');document.querySelector('#log').textContent=x.log||'';}catch(e){document.querySelector('#state').textContent='读取暂不可用：'+e;}setTimeout(refresh,5000);}refresh();</script>
