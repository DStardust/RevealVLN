<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Q35N 动作路径冻结修复</title><style>body{background:#101723;color:#dde7f1;font:16px system-ui;margin:28px;max-width:1100px}table{border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #344152}a{color:#79c7ff}pre{white-space:pre-wrap;max-height:300px;overflow:auto}small{color:#a7b8cb}.card{padding:18px;background:#1b2838;margin:16px 0;border-radius:8px}</style><h1>Q35N · 动作路径冻结修复</h1><p>同一 MONOTONIC：ORIGINAL 已训练参考 vs REPAIR：仅事件MLP更新200步，记忆、动作读出、state_action和初始历史先验全部冻结。</p><small>原 DEV 1 屋，主任务 192/臂；控制任务 192/臂。不是独立盲测或普通 VLN-CE。每 5 秒刷新。</small><div id="state" class="card">读取中</div><div id="probe" class="card"></div><table id="training"></table><h2>仅完整配对组</h2><table id="metrics"></table><p><a href="/report">本轮报告</a> · <a href="/diagnosis">上轮退化定位</a></p><pre id="log"></pre><script>
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const x=await r.json();document.querySelector('#state').textContent=`${x.status.status} · ${x.status.stage||''} · GPU 会话 ${x.gpu_hours.toFixed(3)} 小时 · 封存 ${x.complete}/${x.planned} · ${new Date().toLocaleTimeString()}`;document.querySelector('#probe').textContent=`事件修复更新 ${x.new_training_updates}/600 步；冻结检查 ${x.train_verified?'通过':'待完成'}。ORIGINAL 本轮0更新、重新评测。原有成功保留数以完整配对为准。`;
document.querySelector('#training').innerHTML='<tr><th>模型</th><th>更新</th><th>终态</th></tr>'+x.training.map(y=>`<tr><td>${esc(y.model)}</td><td>${y.step}/${y.target}</td><td>${y.frozen?'冻结参考':y.complete?'完成':'等待/运行'}</td></tr>`).join('');
document.querySelector('#metrics').innerHTML='<tr><th>终点</th><th>方法</th><th>已封存/计划</th><th>PASS</th><th>FAIL</th><th>UNKNOWN</th></tr>'+x.metrics.map(y=>`<tr><td>${esc(y.endpoint)}</td><td>${esc(y.arm)}</td><td>${y.complete}/${y.planned}</td><td>${y.passed}</td><td>${y.failed}</td><td>${y.unknown}</td></tr>`).join('');document.querySelector('#log').textContent=x.log||'';}catch(e){document.querySelector('#state').textContent='读取暂不可用：'+e;}setTimeout(refresh,5000);}refresh();</script>
