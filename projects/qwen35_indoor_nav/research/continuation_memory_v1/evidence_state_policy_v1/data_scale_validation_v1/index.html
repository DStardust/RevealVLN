<!doctype html><meta charset="utf-8"><title>Q35N 数据扩充验证</title><style>body{font:16px system-ui;max-width:1100px;margin:28px auto;background:#101723;color:#dae4f1}pre{white-space:pre-wrap;background:#192638;padding:16px}td,th{padding:9px;text-align:left}progress{width:240px}small{color:#adc1d5}</style><h1>数据扩充是否改善闭环表现</h1><p>OLD / EXPANDED · MONOTONIC · 3 seeds · 每模型 1200 更新</p><div id="status">读取中</div><div id="training"></div><div id="metrics"></div><pre id="log"></pre><small>每 10 秒更新；进程独立于 Codex。训练下降不是导航改善，部分结果不是完整结论。</small><script>
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;');async function refresh(){try{let r=await fetch('/api/status',{cache:'no-store'}),d=await r.json();document.querySelector('#status').innerHTML=`<h2>${esc(d.status.status)} · ${esc(d.status.stage)}</h2><p>CPU 数据 ${d.prepare?.complete??0}/${d.prepare?.total??1491}；Qwen 特征 ${d.feature_windows_written}/${d.feature_total??'待统计'}；已加载模型会话 ${d.model_sessions_loaded}；GPU 会话小时 ${d.gpu_hours.toFixed(2)}</p><p>评测 ${d.complete}/${d.planned}，完整配对组 ${d.groups}/${d.planned_groups}。${esc(d.note)}</p>`;document.querySelector('#training').innerHTML='<table><tr><th>模型</th><th>更新</th><th>进度</th></tr>'+d.training.map(t=>`<tr><td>${esc(t.model)}</td><td>${t.step}/${t.target}</td><td><progress value="${t.step}" max="${t.target}"></progress></td></tr>`).join('')+'</table>';document.querySelector('#metrics').innerHTML='<table><tr><th>终点</th><th>组</th><th>PASS</th><th>已完成 / 计划</th></tr>'+d.metrics.map(m=>`<tr><td>${esc(m.endpoint)}</td><td>${esc(m.arm)}</td><td>${m.passed}</td><td>${m.complete}/${m.planned}</td></tr>`).join('')+'</table>';document.querySelector('#log').textContent=d.status.reason||d.log||''}catch(e){document.querySelector('#status').textContent='读取失败，将重试：'+e}}refresh();setInterval(refresh,10000);
</script>
