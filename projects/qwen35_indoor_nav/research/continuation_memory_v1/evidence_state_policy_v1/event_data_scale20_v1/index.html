<!doctype html><html lang="zh"><meta charset="utf-8"><title>Q35N 20×真实数据生成</title>
<style>body{font:17px system-ui;background:#101826;color:#ecf2f8;max-width:1100px;margin:35px auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #35455a;text-align:left}progress{width:100%;height:30px}small{color:#aebdce}pre{white-space:pre-wrap}</style>
<h1>Q35N · 真实数据扩充</h1><p id="state">读取中…</p><progress id="bar" max="800" value="0"></progress>
<h2 id="count"></h2><p id="sub"></p><small>父族目标至少新增800（旧完整池40的20倍）。终点缺失变体、多个标签和重复窗口不增加父族数。受控 SEE2，尚未训练，不是新方法收益。</small>
<table><thead><tr><th>房屋</th><th>已核验父族</th><th>终点缺失变体</th><th>阶段</th><th>用时</th></tr></thead><tbody id="houses"></tbody></table>
<h3>运行资源</h3><pre id="resources"></pre><p id="stamp"></p>
<script>
const el=id=>document.getElementById(id);
async function refresh(){try{
 const x=await(await fetch('/api/status',{cache:'no-store'})).json(),c=x.counts||x;
 el('state').textContent=x.status+' · '+(x.stage||'')+' · '+(x.training===false||x.training_started===false?'未训练':'');
 el('bar').value=c.new_parents||0;el('count').textContent=(c.new_parents||0)+' / 800 新父族（容量1088）';
 el('sub').textContent='物理交叉执行 '+(c.certified_physical_cross_executions||0)+' · 标签 '+(c.crossed_labels||0)+' · 新父族/旧完整池 '+((c.expansion_vs_old_total||0).toFixed(2))+'×';
 el('houses').replaceChildren();for(const [h,v] of Object.entries(c.houses||{})){
 const tr=document.createElement('tr');for(const s of [h,v.parents+'/64',v.counterparts,v.progress?.stage||'排队',Math.round((v.progress?.seconds||0)/60)+' 分钟']){const td=document.createElement('td');td.textContent=s;tr.appendChild(td)}el('houses').appendChild(tr)}
 el('resources').textContent=JSON.stringify({GPU会话小时:x.gpu_hours,workers:x.workers,error:x.error,disk:x.disk},null,2);
 el('stamp').textContent='最新服务记录 '+new Date((x.unix||0)*1000).toLocaleString()+' · 页面每10秒刷新';
 }catch(e){el('state').textContent='读取失败：'+e}}
refresh();setInterval(refresh,10000);
</script></html>
