[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toporeveal"
version = "0.1.0"
description = "Recoverable branch commitment prototype for RevealNav"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["toporeveal*", "revealnav_mf3*"]
